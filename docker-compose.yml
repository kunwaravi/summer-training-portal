version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://nexusadmin:nexuspassword@db:5432/nexus?schema=public
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexusadmin
      POSTGRES_PASSWORD: nexuspassword
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusadmin -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: