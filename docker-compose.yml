version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nexusadmin}:${DB_PASSWORD:-nexuspassword}@db:5432/${DB_NAME:-nexus}?schema=public
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-nexusadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexuspassword}
      POSTGRES_DB: ${DB_NAME:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexusadmin} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: