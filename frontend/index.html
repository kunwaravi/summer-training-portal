<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- freeCodeCamp-style typeface (Lato + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    
    <!-- Primary SEO Metadata -->
    <title>EduNexus Pro</title>
    <meta name="description" content="Official Professional Certification Portal of EduNexus Pro. Industry-leading programs in Advanced C Programming, C++, IoT, and Embedded Systems." />
    <meta name="keywords" content="EduNexus Pro, C Programming, IoT Certification, Embedded Systems, C++ OOP, Verifiable Credentials, Professional Specialization" />
    <meta name="author" content="EduNexus Pro" />

    <!-- Open Graph / Facebook Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EduNexus Pro - Professional Certification Portal" />
    <meta property="og:description" content="Industry Standard training program with high-resolution verifiable credentialing." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="EduNexus Pro" />

    <!-- Structured JSON-LD Organization Schema for SEO indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "EduNexus Pro",
        "url": "https://edunexus.in",
        "logo": "https://edunexus.in/favicon.svg",
        "description": "Industry Standard professional training and engineering certification portal.",
        "offers": {
          "@type": "Offer",
          "category": "Educational Programs"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
