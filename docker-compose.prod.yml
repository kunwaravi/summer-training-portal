version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nexusadmin}:${DB_PASSWORD:-nexuspassword}@db:5432/${DB_NAME:-nexus}?schema=public
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8090:80"
    restart: always
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-nexusadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexuspassword}
      POSTGRES_DB: ${DB_NAME:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexusadmin} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: edunexuspro_postgres_data
  redis_data:
